name: Build and Deploy Nuget Packages
on:
    push:
      branches:
        - dev
        - master
      tags:
        - v*
    pull_request:
      branches:
        - dev
        - master
    workflow_dispatch:

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # MinVer derives the version from tags, so it needs the full history.
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore Elyfe.Smpp.slnx
      - name: Build
        run: dotnet build Elyfe.Smpp.slnx --configuration Release --no-restore
      - name: Test
        # Client.Tests targets the in-progress Client/ rewrite and does not pass yet;
        # see plans/modernize-elyfe-smpp.md. Widen this once that work lands.
        run: dotnet test Tests/JamaaTech.Smpp.Net.Lib.Tests/JamaaTech.Smpp.Net.Lib.Tests.csproj --configuration Release --no-build
      - name: Pack
        # No --no-build: CopyProjectReferencesToPackage re-invokes Build on Smpp.Net.Lib.
        run: dotnet pack ./JamaaTech.Smpp.Net.Client/Smpp.Net.Client.csproj --configuration Release --output nupkgs
      - name: Upload artifact for Publish job
        uses: actions/upload-artifact@v4
        with:
          name: .nuget-package
          path: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg
  deploy-package:
    runs-on: ubuntu-latest
    needs:
      - build-package
    if: ${{ github.event_name != 'pull_request' && github.ref_type == 'tag' }}
    steps:
      - name: Download artifact from build job
        id: download
        uses: actions/download-artifact@v4
        with:
          name: .nuget-package
      - name: Publish
        run: dotnet nuget push ${{ steps.download.outputs.download-path }}/*.nupkg --api-key ${{secrets.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
